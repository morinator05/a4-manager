[project]
name = "a4-manager"
version = "0.1.0"
description = "Duty manager (Küchendienst, Mülldienst, strikes) for dorm floor A4"
authors = [
    { name = "Mori", email = "roemoben@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
