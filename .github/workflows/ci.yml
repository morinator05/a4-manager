name: CI

on:
  push:
    branches: [main, ci/pytest-ruff]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a4
          POSTGRES_PASSWORD: a4
          POSTGRES_DB: a4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a4"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://a4:a4@localhost:5432/a4_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
