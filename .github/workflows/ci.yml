name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a4
          POSTGRES_PASSWORD: a4
          POSTGRES_DB: a4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a4"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://a4:a4@localhost:5432/a4_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      # Tests build the tables from the models; check the migrations build the same ones.
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://a4:a4@localhost:5432/a4_migrations
          SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
        run: |
          PGPASSWORD=a4 psql -h localhost -U a4 -d a4_test -c "CREATE DATABASE a4_migrations"
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build .
