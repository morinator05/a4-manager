services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a4
      # From .env. Only applied when the database volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: a4
    ports:
      # Only reachable from this machine; the app container uses the internal network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a4"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://a4:${POSTGRES_PASSWORD}@db:5432/a4
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "8000:8000"
    profiles: ["app"]

volumes:
  pgdata:
